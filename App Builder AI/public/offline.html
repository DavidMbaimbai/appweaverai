<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — AppWeaver AI</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0b0b0d;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card { max-width: 360px; padding: 24px; }
      img { width: 56px; height: 56px; margin-bottom: 16px; border-radius: 12px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #9a9a9f; margin: 0; line-height: 1.5; }
      button {
        margin-top: 20px;
        background: #ff3c00;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="AppWeaver AI" />
      <h1>You're offline</h1>
      <p>Check your connection. Anything you were building is safe — reconnect and pick up right where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
