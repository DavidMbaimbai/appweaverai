services:
  postgres:
    image: postgres:16-alpine
    container_name: appweaverai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appweaverai
      POSTGRES_PASSWORD: appweaverai
      POSTGRES_DB: appweaverai
    ports:
      - '5432:5432'
    volumes:
      - appweaverai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appweaverai -d appweaverai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  appweaverai_postgres_data:
