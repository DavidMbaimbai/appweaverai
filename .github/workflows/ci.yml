name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App Builder AI
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_build
      BETTER_AUTH_SECRET: ci-build-secret-not-used-at-runtime-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App Builder AI/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App Builder AI
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appweaverai_it_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates and drops its own throwaway appweaverai_it_* database; the guard accepts localhost only.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appweaverai_it_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App Builder AI/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App Builder AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Report only: advisories stay visible in the log without blocking merges.
      - run: npm audit --audit-level=high
        continue-on-error: true
