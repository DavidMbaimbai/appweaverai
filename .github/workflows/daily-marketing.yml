name: Daily marketing video

# GitHub schedules are UTC. 21:00 UTC records and queues the video; the post is
# scheduled for 22:00 UTC (00:00 UTC+2) and published by the second schedule.
on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '5 22 * * *'
  workflow_dispatch:

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: App Builder AI
    env:
      DEMO_BASE_URL: ${{ secrets.DEMO_BASE_URL }}
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: App Builder AI/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record the video (AI presenter, user-side screens only)
        run: node scripts/make-demo-video.mjs
      - name: Upload to S3 and create a link valid for 24h
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          key="marketing/$(date -u +%F).mp4"
          aws s3 cp videos/appweaver-demo.mp4 "s3://${{ secrets.MARKETING_S3_BUCKET }}/$key" --content-type video/mp4
          url=$(aws s3 presign "s3://${{ secrets.MARKETING_S3_BUCKET }}/$key" --expires-in 86400)
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Queue the post for midnight
        env:
          VIDEO_URL: ${{ steps.upload.outputs.url }}
        run: node scripts/queue-demo-post.mjs

  publish:
    if: github.event.schedule == '5 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X GET "${{ secrets.DEMO_BASE_URL }}/api/cron/social-post" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
